<!DOCTYPE html>
<html>
<head>
    <title>Red Bull</title>
    <meta charset="utf-8">

    <link href="https://cdn.bootcss.com/flexslider/2.6.3/flexslider.min.css" rel="stylesheet">
    <script src="https://cdn.bootcss.com/jquery/2.2.2/jquery.min.js"></script>
    <script src="https://cdn.bootcss.com/flexslider/2.6.3/jquery.flexslider-min.js"></script>        

    <script>
        $(window).load(function() {
            $('.flexslider').flexslider({
                animation: "slide", 
                rtl: true
            });
        });
    </script>

    <style>
        *{
            margin:0;
            color:gray;
            text-align:center;
            box-sizing: border-box;
        }

       
        .top{
            background-color: white;
        }
        .top .container{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding:10px;
        }
        .top .logo{
            font-size: 35px;
            font-weight: bold;
        }
        .top .logo img{
            width: 100px;
            vertical-align: middle;
        }
        .top .top-nav{
            font-size: 25px;
            font-weight: bold;       
        }
        .top .top-nav a{
            text-decoration: none;
            margin-left: 10px;
        }

        
        .nav {
            background-color:#333;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 1000;
        }
        .nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            background-color: #333;
        }
        .nav > ul > li {
            float: left;
            position: relative;
        }
        .nav li a {    
            display: block;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
        }
        .nav li a:hover {
            background-color: #111;
        }

       
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #444;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            top: 100%;
            left: 0;
        }
        .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }
        .dropdown-content a:hover {
            background-color: #C8102E;
        }
        
        .dropdown:hover .dropdown-content {
            display: block;
        }
        

        
        .slider{
            background-color: black;
        }

        
        .banner{
            background-image: linear-gradient(#001F3F,#C8102E);
            padding:40px;
            color:white;
        }
        .banner h1{
            padding: 15px;
            color:white;
        }

       
        .faculty {
            background-color:white;
            padding:40px;
        }
        .faculty h2 {
            font-size: 26px;
            color: rgb(50,51,52);
            padding-bottom:40px;
        }
        .faculty .container {
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        .faculty .teacher{
            width: 220px;
            padding: 20px;
        }
        .faculty .teacher img{
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .faculty .teacher h3{
            margin-top: 15px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }

        /* info */
        .contact {
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }
        .contact .container{
            width: 70%;
        }
        .contact h2{
            font-size: 26px;
            color: #333;
        }
        .contact .infos{
            margin-top: 30px;
            text-align: left;
        }
        .contact .infos b{
            display:block;
            margin-top: 15px;
            font-size: 18px;
            color: #333;
        }
        .contact .infos span{
            display:block;
            margin-top: 5px;
            color: #555;
        }

        /* footer */
        .footer{
            background-color: rgb(25,26,30);
            padding: 30px 0;
            color:white;
        }
    </style>
</head>

<body>

<div class="top">
    <div class="container">
        <div class="logo">
            <img src="https://images.seeklogo.com/logo-png/40/1/red-bull-racing-f1-logo-png_seeklogo-406796.png" alt="紅牛車隊標誌">
            Oracle Red Bull Racing
        </div>
        <div class="top-nav">
            <a href="#">首頁</a>
            <a href="#">車隊</a>
            <a href="#">登入</a>
        </div>
    </div>
</div>

<div class="nav">   
    <ul>
        <li><a href="#introduction">車隊簡介</a></li>
        <li class="dropdown">
            <a href="#faculty">車手介紹</a>
            <div class="dropdown-content">
                <a href="#driver1">馬克斯·維斯塔潘</a>
                <a href="#driver2">角田裕毅</a>
            </div>
        </li>
        <li><a href="#about">車隊資料</a></li>
    </ul>
</div>

<div class="slider">
  <div class="flexslider" style="direction:rtl">
    <ul class="slides">
      <li><img src="https://via.placeholder.com/1200x400/001F3F/FFFFFF?text=Slide+1" alt="Red Bull F1 動態照"></li>
      <li><img src="https://via.placeholder.com/1200x400/C8102E/FFFFFF?text=Slide+2" alt="Red Bull F1 賽車"></li>
      <li><img src="https://via.placeholder.com/1200x400/000000/FFFFFF?text=Slide+3" alt="F1 在賽道上"></li>
    </ul>
  </div>
</div>

<div class="banner" id="introduction">
    <h1>Oracle 紅牛車隊</h1>
    <h1>FIA 世界一級方程式錦標賽車隊</h1>
    <h1>多次獲得車隊及車手冠軍</h1>
    <h1>以創新、速度與性能為驅動力</h1>
</div>

<div class="faculty" id="faculty">
    <h2>車手介紹</h2>
    <div class="container">
        <div class="teacher" id="driver1">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3973_by_Stepro_%28medium_crop%29.jpg/250px-2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3973_by_Stepro_%28medium_crop%29.jpg" alt="Max Verstappen">
            <h3>馬克斯·維斯塔潘</h3>
        </div>
        <div class="teacher" id="driver2">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/2021_US_GP%2C_Tsunoda.jpg/250px-2021_US_GP%2C_Tsunoda.jpg" alt="Yuki Tsunoda">
            <h3>角田裕毅</h3>
        </div>
    </div>
</div>

<div class="contact" id="about">
    <div class="container">
        <h2>車隊資料</h2>
        <div class="infos">
            <b>車隊名稱</b>
            <span>Oracle 紅牛車隊</span>

            <b>總部</b>
            <span>英國 米爾頓凱恩斯</span>

            <b>成立年份</b>
            <span>2005 年</span>

            <b>冠軍紀錄</b>
            <span>多次 FIA 世界一級方程式車手及車隊冠軍</span>

            <b>動力單元</b>
            <span>Red Bull Powertrains</span>
        </div>
    </div>
</div>

<div class="footer">
    &copy; 2025 Oracle 紅牛車隊. 版權所有
</div>

</body>
</html>
