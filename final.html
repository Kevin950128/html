<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>Oracle Red Bull Racing</title>

    <!-- FlexSlider -->
    <link href="https://cdn.bootcss.com/flexslider/2.6.3/flexslider.min.css" rel="stylesheet">
    <script src="https://cdn.bootcss.com/jquery/2.2.2/jquery.min.js"></script>
    <script src="https://cdn.bootcss.com/flexslider/2.6.3/jquery.flexslider-min.js"></script>

    <script>
    $(window).load(function () {
        $('.flexslider').flexslider({
            animation: "slide",
            slideshow: true,
            slideshowSpeed: 3000,
            animationSpeed: 600,
            pauseOnHover: true,
            directionNav: true,
            controlNav: true,
            rtl: true
        });
    });
    </script>

    <style>
        *{
            margin:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ===== Top ===== */
        .top{
            background:white;
        }
        .top .container{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:10px 20px;
        }
        .logo{
            font-size:28px;
            font-weight:bold;
        }
        .logo img{
            width:90px;
            vertical-align:middle;
        }
        .top-nav a{
            text-decoration:none;
            margin-left:15px;
            font-size:18px;
            color:#333;
        }

        /* ===== Nav ===== */
        .nav{
            background:#333;
            display:flex;
            justify-content:center;
        }
        .nav ul{
            list-style:none;
            display:flex;
            padding:0;
            margin:0;
        }
        .nav li{
            position:relative;
        }
        .nav a{
            display:block;
            padding:14px 24px;
            color:white;
            text-decoration:none;
            font-weight:bold;
        }
        .nav a:hover{
            background:#111;
        }

        /* 下拉選單 */
        .dropdown-content{
            display:none;
            position:absolute;
            top:100%;
            left:0;
            background:#333;
            min-width:200px;
            text-align:center;
            z-index:999;
        }
        .dropdown-content a{
            padding:14px 0;
        }
        .dropdown-content a:hover{
            background:#C8102E;
        }
        .dropdown:hover .dropdown-content{
            display:block;
        }

        /* ===== Slider ===== */
        .hero-slider{
            margin:0;
            border:none;
        }
        .hero-slider li{
            position:relative;
        }
        .hero-slider img{
            width:100%;
            height:80vh;
            object-fit:cover;
        }

        .slide-caption{
            position:absolute;
            bottom:20%;
            left:10%;
            background:rgba(0,0,0,0.45);
            padding:20px 30px;
            border-radius:8px;
            color:white;
        }
        .slide-caption h2{
            font-size:36px;
            color:white;
        }
        .slide-caption p{
            font-size:20px;
            margin-top:10px;
            color:#ddd;
        }

        /* arrows & dots */
        .flex-direction-nav a:before{
            font-size:40px;
            color:white;
        }
        .flex-control-paging li a{
            background:rgba(255,255,255,0.5);
        }
        .flex-control-paging li a.flex-active{
            background:#C8102E;
        }

        /* ===== Banner ===== */
        .banner{
            background:linear-gradient(#001F3F,#C8102E);
            text-align:center;
            padding:40px;
            color:white;
        }
        .banner h1{
            margin:10px 0;
        }

        /* ===== Drivers ===== */
        .faculty{
            padding:40px;
            text-align:center;
        }
        .faculty h2{
            margin-bottom:30px;
        }
        .faculty .container{
            display:flex;
            justify-content:center;
            gap:40px;
        }
        .teacher img{
            width:200px;
            height:200px;
            border-radius:50%;
            object-fit:cover;
            box-shadow:0 4px 10px rgba(0,0,0,.3);
        }

        /* ===== Info ===== */
        .contact{
            display:flex;
            justify-content:center;
            padding:40px 0;
        }
        .contact .container{
            width:70%;
        }
        .infos b{
            display:block;
            margin-top:15px;
        }

        /* ===== Footer ===== */
        .footer{
            background:#191A1E;
            color:white;
            text-align:center;
            padding:25px 0;
        }

        /* ===== Mobile ===== */
        @media(max-width:768px){
            .hero-slider img{
                height:60vh;
            }
            .slide-caption{
                left:5%;
                right:5%;
                text-align:center;
            }
            .slide-caption h2{
                font-size:24px;
            }
            .slide-caption p{
                font-size:16px;
            }
            .faculty .container{
                flex-direction:column;
            }
        }
    </style>
</head>

<body>

<!-- Top -->
<div class="top">
    <div class="container">
        <div class="logo">
            <img src="https://images.seeklogo.com/logo-png/40/1/red-bull-racing-f1-logo-png_seeklogo-406796.png">
            Oracle Red Bull Racing
        </div>
        <div class="top-nav">
            <a href="#">首頁</a>
            <a href="#">車隊</a>
            <a href="#">登入</a>
        </div>
    </div>
</div>

<!-- Nav（已加下拉選單） -->
<div class="nav">
    <ul>
        <li><a href="#">首頁</a></li>
        <li><a href="#intro">車隊簡介</a></li>

        <li class="dropdown">
            <a href="#drivers">成員簡介</a>
            <div class="dropdown-content">
                <a href="#max">馬克斯·維斯塔潘</a>
                <a href="#yuki">角田裕毅</a>
            </div>
        </li>

        <li><a href="#info">相關資訊</a></li>
    </ul>
</div>

<!-- Slider -->
<div class="flexslider hero-slider">
    <ul class="slides">
        <li>
            <img src="https://cdn.pixabay.com/photo/2023/07/22/09/28/red-bull-8143008_640.jpg">
        </li>
        <li>
            <img src="https://images.pexels.com/photos/35210800/pexels-photo-35210800.jpeg">
        </li>
        <li>
            <img src="https://www.carstuff.com.tw/media/k2/items/cache/c47416829040058b61e05328b569b421_XL.jpg">
        </li>
    </ul>
</div>

<!-- Banner -->
<div class="banner" id="intro">
    <h1>Oracle 紅牛車隊</h1>
    <h1>FIA 世界一級方程式</h1>
</div>

<!-- Drivers -->
<div class="faculty" id="drivers">
    <h2>車手介紹</h2>
    <div class="container">
        <div class="teacher" id="max">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3973_by_Stepro_%28medium_crop%29.jpg/250px-2024-08-25_Motorsport%2C_Formel_1%2C_Gro%C3%9Fer_Preis_der_Niederlande_2024_STP_3973_by_Stepro_%28medium_crop%29.jpg">
            <h3>馬克斯·維斯塔潘</h3>
        </div>
        <div class="teacher" id="yuki">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/2021_US_GP%2C_Tsunoda.jpg/250px-2021_US_GP%2C_Tsunoda.jpg">
            <h3>角田裕毅</h3>
        </div>
    </div>
</div>

<!-- Info -->
<div class="contact" id="info">
    <div class="container">
        <h2>車隊資料</h2>
        <div class="infos">
            <b>車隊名稱</b> Oracle Red Bull Racing
            <b>總部</b> 英國 米爾頓凱恩斯
            <b>成立</b> 2005 年
            <b>動力單元</b> Red Bull Powertrains
        </div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    © 2025 Oracle Red Bull Racing
</div>

</body>
</html>
